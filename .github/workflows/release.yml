name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

  build:
    needs: check-version
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          # 22.04 (glibc 2.35) so binaries load on older distros than the latest runner
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npx napi build --platform --release --no-const-enum --target ${{ matrix.target }}
      # Every matrix runner is native for its target, so each binary can be loaded.
      - name: Smoke test
        run: |
          node -e "const {segment}=require('./index.js');const s='\u1781\u17D2\u1789\u17BB\u17C6\u179F\u17D2\u179A\u17B6\u179B\u17CB\u1797\u17D2\u1793\u17B6\u17C6\u1796\u17C1\u1789';const w=segment(s);if(!(s.length>0&&w.length>=1&&w.join('')===s))process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: npm run artifacts
      - name: Publish platform packages (skip already published)
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          for dir in npm/*/; do
            pkg="$(node -p "require('./${dir}package.json').name")"
            pv="$(node -p "require('./${dir}package.json').version")"
            test "$pv" = "$ver" || { echo "::error::$pkg version $pv does not match root $ver"; exit 1; }
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "::notice::$pkg@$ver already published, skipping"
            else
              npm publish "$dir" --access public --provenance
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Publish root package (skip already published)
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          if npm view "kh-lang@$ver" version >/dev/null 2>&1; then
            echo "::notice::kh-lang@$ver already published, skipping"
          else
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.optionalDependencies={};for(const d of fs.readdirSync('npm')){const m=JSON.parse(fs.readFileSync('npm/'+d+'/package.json','utf8'));p.optionalDependencies[m.name]=p.version;}fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
            npm publish --ignore-scripts --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
