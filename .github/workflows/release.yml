name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag matches package.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

  verify:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit

  build:
    needs: [check-version, verify]
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci --ignore-scripts
      - run: npx napi build --platform --release --no-const-enum --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          node -e "const {segment}=require('./index.js');const s='\u1781\u17D2\u1789\u17BB\u17C6\u179F\u17D2\u179A\u17B6\u179B\u17CB\u1797\u17D2\u1793\u17B6\u17C6\u1796\u17C1\u1789';const w=segment(s);if(!(s.length>0&&w.length>=1&&w.join('')===s))process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - run: npm run artifacts
      - name: Publish platform packages (skip already published)
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          for dir in npm/*/; do
            pkg="$(node -e "console.log(require(process.argv[1]).name)" "./${dir}package.json")"
            pv="$(node -e "console.log(require(process.argv[1]).version)" "./${dir}package.json")"
            main="$(node -e "console.log(require(process.argv[1]).main)" "./${dir}package.json")"
            test "$pv" = "$ver" || { echo "::error::$pkg version $pv does not match root $ver"; exit 1; }
            test -f "${dir}${main}" || { echo "::error::missing binary ${dir}${main}"; exit 1; }
            if test "$(npm view "$pkg@$ver" version 2>/dev/null || true)" = "$ver"; then
              echo "::notice::$pkg@$ver already published, skipping"
            elif test "$(npm view "$pkg" dist-tags.latest 2>/dev/null || true)" = "0.0.0-stage"; then
              echo "::notice::$pkg has a staged publish (0.0.0-stage) awaiting npm approval, skipping"
            else
              npm publish "$dir" --ignore-scripts --access public --provenance
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Publish root package (skip already published)
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          if test "$(npm view "kh-lang@$ver" version 2>/dev/null || true)" = "$ver"; then
            echo "::notice::kh-lang@$ver already published, skipping"
          elif test "$(npm view "kh-lang" dist-tags.latest 2>/dev/null || true)" = "0.0.0-stage"; then
            echo "::notice::kh-lang has a staged publish (0.0.0-stage) awaiting npm approval, skipping"
          else
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.optionalDependencies={};for(const e of fs.readdirSync('npm',{withFileTypes:true}).filter(e=>e.isDirectory()).map(e=>e.name).sort()){const m=JSON.parse(fs.readFileSync('npm/'+e+'/package.json','utf8'));p.optionalDependencies[m.name]=p.version;}fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
            npm publish --ignore-scripts --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
