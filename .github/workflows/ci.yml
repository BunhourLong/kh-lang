name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  node:
    name: node (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit

  pack:
    name: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/generate-gold.mjs && git diff --exit-code -- test/fixtures/gold-100.mjs
      - run: npm pack --dry-run --json > pack.json
      - name: Verify package contents
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs')
          const [pack] = JSON.parse(readFileSync('pack.json', 'utf8'))
          const files = pack.files.map((file) => file.path)

          for (const required of [
            'index.js',
            'index.d.ts',
            'README.md',
            'LICENSE',
            'licenses/khmerlbdict-LICENSE',
          ]) {
            if (!files.includes(required)) {
              throw new Error(`missing required file: ${required}`)
            }
          }
          if (files.some((file) => file.endsWith('.node'))) {
            throw new Error('root tarball must not contain .node binaries')
          }
          for (const forbidden of ['test/', '.kh-lang/', 'target/', 'node_modules/']) {
            if (files.some((file) => file.startsWith(forbidden))) {
              throw new Error(`unexpected package entry under ${forbidden}`)
            }
          }

          console.log(`package contents ok (${files.length} files)`)
          NODE
